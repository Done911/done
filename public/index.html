<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery ERP</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-bg"></div>
  <header class="topbar">
    <div class="brand">
      <div class="brand__logo">🚚</div>
      <div>
        <h1>منصة إدارة شركة التوصيل</h1>
        <p>لوحة تشغيل داخلية: مناديب، حسابات، مالية، تقارير، وتحليلات ذكية</p>
      </div>
    </div>
    <span id="currentRole" class="chip">غير مسجل</span>
  </header>

  <main class="layout">
    <section class="panel" data-roles="guest">
      <h2>تسجيل الدخول</h2>
      <form id="loginForm" class="form">
        <label>اسم المستخدم<input name="username" required /></label>
        <label>كلمة المرور<input name="password" type="password" required /></label>
        <button class="btn btn--primary" type="submit">دخول</button>
      </form>
      <p id="authState" class="feedback"></p>
    </section>

    <section class="panel panel--wide hidden" data-roles="general_manager,hr,finance,supervisor">
      <div class="panel__title"><h2>Dashboard</h2><button class="btn" id="refreshDashboardBtn">تحديث</button></div>
      <div id="dashboardCards" class="stats"></div>
    </section>

    <section class="panel hidden" data-roles="general_manager,hr,supervisor">
      <h2>إضافة مندوب</h2>
      <form id="driverForm" class="form">
        <label>الاسم الكامل<input name="full_name" required /></label>
        <label>رقم الإقامة<input name="iqama_number" required /></label>
        <label>الهاتف<input name="phone" required /></label>
        <label>الجنسية<input name="nationality" /></label>
        <button class="btn" type="submit">حفظ</button>
      </form>
    </section>

    <section class="panel hidden" data-roles="general_manager,supervisor">
      <h2>إضافة تطبيق</h2>
      <form id="appForm" class="form">
        <label>اسم التطبيق<input name="app_name" required /></label>
        <label>نوع الهدف<select name="target_type"><option value="orders">orders</option><option value="revenue">revenue</option></select></label>
        <label>قيمة الهدف<input name="target_value" type="number" required /></label>
        <button class="btn" type="submit">حفظ</button>
      </form>
    </section>

    <section class="panel hidden" data-roles="general_manager,supervisor">
      <h2>إضافة حساب تطبيق</h2>
      <form id="accountForm" class="form">
        <label>App ID<input name="app_id" type="number" required /></label>
        <label>اسم المستخدم الحقيقي<input name="real_user_name" required /></label>
        <label>إقامة المستخدم<input name="real_user_iqama" required /></label>
        <label>جوال المستخدم<input name="real_user_phone" required /></label>
        <button class="btn" type="submit">حفظ</button>
      </form>
    </section>

    <section class="panel panel--wide hidden" data-roles="general_manager,supervisor,finance">
      <h2>إدخال العملية اليومية</h2>
      <form id="dailyForm" class="form grid">
        <label>التاريخ<input name="date" type="date" required /></label>
        <label>Driver ID<input name="driver_id" type="number" required /></label>
        <label>App ID<input name="app_id" type="number" required /></label>
        <label>Account ID<input name="account_id" type="number" required /></label>
        <label>عدد الطلبات<input name="orders_count" type="number" required /></label>
        <label>إجمالي الإيراد<input name="total_revenue" type="number" required /></label>
        <label>بداية الشفت<input name="shift_start" type="time" required /></label>
        <label>نهاية الشفت<input name="shift_end" type="time" required /></label>
        <label>عدد ساعات الشفت<input name="shift_hours" type="number" step="0.1" required /></label>
        <button class="btn btn--primary grid__action" type="submit">حفظ العملية</button>
      </form>
    </section>

    <section class="panel panel--wide hidden" data-roles="general_manager,hr,finance,supervisor">
      <div class="panel__title"><h2>AI Analytics + Alerts</h2><button id="refreshInsightsBtn" class="btn">تحديث</button></div>
      <pre id="insights"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
